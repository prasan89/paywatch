services:
  - type: web
    name: paywatch-api
    runtime: python
    buildCommand: pip install -e ".[modal]"
    startCommand: uvicorn paypalfm.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_MERCHANT_EMAIL
        sync: false
      - key: PFM_LEDGER_DB
        value: /tmp/ledger.db
    healthCheckPath: /api/stats

  - type: web
    name: paywatch-dashboard
    runtime: static
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://paywatch-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
