[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paypal-fraud-monitor"
version = "0.1.0"
description = "Open-source PayPal package fraud detection using Claude: live npm/PyPI monitor, cited verdicts, install guard."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "opentimestamps-client>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
modal = ["modal>=0.63.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0"]

[project.scripts]
pfm = "paypalfm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paypalfm"]

[tool.ruff]
line-length = 100
